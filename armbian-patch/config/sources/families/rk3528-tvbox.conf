source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

OVERLAY_PREFIX='rk3528-tvbox'

case $BRANCH in

	legacy)
		UBOOT_COMPILER="aarch64-linux-gnu-"
		BOOTSOURCE='https://github.com/HK1RBOXK8S/u-boot.git'
		BOOTBRANCH='branch:hk1rboxk8sv202607'
		BOOTDIR='u-boot-rockchip64'
		BOOTPATCHDIR="legacy/board_rk3528-tvbox"
		KERNELSOURCE='https://github.com/HK1RBOXK8S/linux-6.18.44.git'
		KERNELBRANCH='branch:main'
		KERNELDEFCONFIG='linux_rk3528_hk1rboxk8s_defconfig'
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		declare -g KERNEL_MAJOR_MINOR="6.18"   # Major and minor versions of this kernel.
		KERNELDIR='linux-rockchip64'
		KERNELPATCHDIR='rk3528-tvbox-legacy'

		;;

	current | edge)
		SKIP_BOOTSPLASH="yes"

		;;

esac

prepare_boot_configuration

family_tweaks_bsp() {
	:
}
